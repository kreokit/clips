# cargo-deny: run in CI (`cargo deny check licenses bans sources`). Fails the build if a
# dependency's licence isn't on this list, so GPL code can't slip into the app
# (CLAUDE.md: licences must stay MIT/Apache-compatible).

[graph]
all-features = false

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft, used by a few Tauri deps).
# Crates offering a choice (e.g. "MIT OR Apache-2.0 OR LGPL-2.1-or-later") pass via an
# allowed option.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
