[package]
name = "clips"
version = "0.1.0"
description = "Free, offline short clips from your long videos. Part of KreoKit."
authors = ["KreoKit contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clips_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.11.0"
ureq = "3"
# Face detection (BlazeFace) for reframing. Pinned exactly as in KreoKit Cutout: ort
# 2.0.0-rc.10 (ONNX Runtime 1.22.0, statically linked) is the last release with a prebuilt
# library for Intel Macs, and it runs on macOS 12. rc.11+ dropped x86_64-apple-darwin.
# Re-test macOS 12 and cpu.rs after any upgrade (see Cutout's CLAUDE.md, "Inference").
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
whisper-rs = "0.16.0"
# The same version whisper-rs uses; for reading finished segments while Whisper runs.
whisper-rs-sys = "0.15.0"

# Free disk space before Export all (statvfs); already in the tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
