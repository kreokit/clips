# Tests on every push and pull request: Linux (everything, including the FFmpeg tests,
# plus licence checks), macOS and Windows (frontend build + Rust tests, which also prove
# the app links on each platform).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tests and licence checks
    runs-on: ubuntu-22.04
    env:
      # The Whisper tests find the base model in <KREOKIT_APP_DATA>/models.
      KREOKIT_APP_DATA: ${{ runner.temp }}/com.kreokit.clips
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages for Tauri, and FFmpeg for the probe tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - name: Cache the Whisper base model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/com.kreokit.clips/models
          key: whisper-ggml-base-60ed5bc3
      - name: Whisper base model from our mirror
        run: |
          dir="$KREOKIT_APP_DATA/models"
          mkdir -p "$dir"
          if [ ! -f "$dir/ggml-base.bin" ]; then
            curl -fL --retry 3 -o "$dir/ggml-base.bin" \
              https://github.com/kreokit/clips/releases/download/models-v1/ggml-base.bin
          fi
          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  $dir/ggml-base.bin" \
            | sha256sum -c -
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Rust tests (with the FFmpeg and Whisper ones)
        working-directory: src-tauri
        run: cargo test --locked -- --include-ignored
      - name: Rust dependency licences (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
      - name: THIRD-PARTY-LICENSES.md is up to date
        run: python scripts/third_party.py --check

  desktop:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # macOS: the classic Accelerate cblas_sgemm, as the release builds (CLAUDE.md lessons).
      CXXFLAGS: ${{ startsWith(matrix.os, 'macos') && '-UACCELERATE_NEW_LAPACK -UACCELERATE_LAPACK_ILP64' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # whisper-rs-sys doesn't rebuild when CXXFLAGS change; change the key then.
          key: accelerate-classic
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
