# Converts MediaPipe BlazeFace full-range (Apache-2.0) to ONNX for the reframe's face
# detector with scripts/export_blazeface.py, checks it against TFLite on fixtures/faces, and
# uploads the file, report and previews as a build artifact. Publishing to the models-v2
# release is a separate, manual step after the user has seen the report (see CLAUDE.md,
# "Reframe").
name: Export BlazeFace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned export tools
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 tf2onnx==1.16.1 onnx==1.15.0 onnxruntime==1.22.0 \
            "numpy==1.26.4" "protobuf==3.20.3" pillow==11.0.0
          pip freeze > pip-freeze.txt

      - name: Export and check
        run: |
          python scripts/export_blazeface.py --out dist --photos fixtures/faces
          cp pip-freeze.txt dist/
          cat dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blazeface-export
          path: dist/
          retention-days: 14
